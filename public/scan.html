<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan — Smart Attendance</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<div class="container">
  <h1>Smart Attendance</h1>
  <div class="subtitle">Student — scan the session QR to mark yourself present</div>

  <nav>
    <a href="index.html">Admin</a>
    <a href="session.html">Start Session</a>
    <a href="scan.html" class="active">Scan (Student)</a>
  </nav>

  <div class="card">
    <h2>Your ID</h2>
    <label>Paste your student token (given by admin, or from your ID QR)</label>
    <input id="studentToken" placeholder="e.g. 9f2a1b...">
    <button class="secondary" onclick="saveToken()">Save Token on this device</button>
    <div id="tokenMsg"></div>
  </div>

  <div class="card">
    <h2>Scan Session QR</h2>
    <div id="reader"></div>
    <div id="scanMsg"></div>
  </div>
</div>

<script>
const API = '/api';

function saveToken() {
  const token = document.getElementById('studentToken').value.trim();
  if (!token) return;
  localStorage.setItem('student_token', token);
  document.getElementById('tokenMsg').innerHTML = `<div class="msg success">Saved. You can scan now.</div>`;
}

// Auto-save if opened via a personal link (scan.html?token=...), which the
// admin shares once per student — this removes the manual copy-paste step.
// Otherwise, pre-fill from whatever was already saved on this device.
window.addEventListener('load', () => {
  const urlToken = new URLSearchParams(window.location.search).get('token');
  if (urlToken) {
    localStorage.setItem('student_token', urlToken);
    document.getElementById('studentToken').value = urlToken;
    document.getElementById('tokenMsg').innerHTML = `<div class="msg success">Your ID was saved automatically. You're ready to scan.</div>`;
    // Clean the token out of the visible URL/history for privacy
    window.history.replaceState({}, '', window.location.pathname);
  } else {
    const saved = localStorage.getItem('student_token');
    if (saved) document.getElementById('studentToken').value = saved;
  }
});

let scanLocked = false;

function onScanSuccess(decodedText) {
  if (scanLocked) return;
  let payload;
  try {
    payload = JSON.parse(decodedText);
  } catch (e) {
    return; // ignore unrelated QR codes
  }
  if (!payload.session_id || !payload.qr_token) return;

  const student_token = localStorage.getItem('student_token');
  if (!student_token) {
    document.getElementById('scanMsg').innerHTML =
      `<div class="msg error">Save your student token above first.</div>`;
    return;
  }

  scanLocked = true;

  // Try to get location — some sessions require it (anti-proxy geofence).
  // If location isn't available, we still attempt the scan; the server only
  // rejects it if that particular session actually requires location.
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => markAttendance(payload.session_id, payload.qr_token, student_token, pos.coords.latitude, pos.coords.longitude),
      () => markAttendance(payload.session_id, payload.qr_token, student_token, null, null),
      { timeout: 5000 }
    );
  } else {
    markAttendance(payload.session_id, payload.qr_token, student_token, null, null);
  }
}

async function markAttendance(session_id, qr_token, student_token, student_lat, student_lng) {
  const msg = document.getElementById('scanMsg');
  try {
    const res = await fetch(`${API}/attendance/mark`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ session_id, qr_token, student_token, student_lat, student_lng })
    });
    const data = await res.json();
    if (res.ok) {
      msg.innerHTML = `<div class="msg success">✅ ${data.message}</div>`;
      await stopScanner(); // success — no need to keep the camera running
    } else {
      msg.innerHTML = `<div class="msg error">${data.error}</div>`;
      if (res.status === 409) {
        // "already marked" — also a terminal state, stop scanning
        await stopScanner();
      } else {
        // a real error (expired QR, wrong course, etc) — let them try again
        scanLocked = false;
      }
    }
  } catch (e) {
    msg.innerHTML = `<div class="msg error">Network error. Try again.</div>`;
    scanLocked = false;
  }
}

async function stopScanner() {
  try {
    await html5QrCode.stop();
    document.getElementById('reader').innerHTML =
      '<div style="text-align:center;padding:24px;color:#666;">Camera stopped. Refresh this page to scan again for a new session.</div>';
  } catch (e) {
    // camera may already be stopped — safe to ignore
  }
}

const html5QrCode = new Html5Qrcode("reader");
Html5Qrcode.getCameras().then(cameras => {
  if (cameras && cameras.length) {
    const cameraId = cameras[cameras.length - 1].id; // prefer back camera if present
    html5QrCode.start(
      cameraId,
      { fps: 10, qrbox: 240 },
      onScanSuccess
    );
  } else {
    document.getElementById('scanMsg').innerHTML = `<div class="msg error">No camera found.</div>`;
  }
}).catch(err => {
  document.getElementById('scanMsg').innerHTML = `<div class="msg error">Camera access denied or unavailable.</div>`;
});
</script>
</body>
</html>
